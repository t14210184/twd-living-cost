name: Real-browser FX and living-cost checks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-e2e.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium web testing
        run: python -m pip install 'selenium>=4.25,<5'
      - name: Check actual deployed FX and CPI in Chrome (desktop+mobile)
        run: python ci/browser_e2e.py
      - name: Upload real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-fx-website-browser
          path: browser-artifacts/
          if-no-files-found: ignore
