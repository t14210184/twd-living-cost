name: Official CPI refresh and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'config/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-cpi-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test CPI contract
        run: python -m unittest discover -s tests -v
      - name: Prepare pinned official TWCA chain and verify host TLS
        run: python scripts/prepare_cpi_tls.py
      - name: Validate and unit-test integrated household purchasing power
        run: |
          node --check site/app.js
          node --check site/fx.js
          node --check site/life_math.js
          node --check site/life.js
          node --test tests/life.test.cjs
          grep -q 'id="fxChart"' site/index.html
          grep -q 'id="living"' site/index.html
          grep -q 'id="lifeChart"' site/index.html
      - name: Download and verify official CPI
        run: python scripts/update_cpi.py
      - name: Obtain and verify 10-year US Federal Reserve H10 FX
        run: python scripts/update_fx.py
      - name: Reject unauthorized FX and retail series
        run: |
          test ! -d site/data/fx
          test ! -d site/data/retail
          test ! -f site/data/fx.csv
      - name: Commit verified FX and CPI against newest main, not stale runner checkout
        run: |
          if [ -n "$(git status --porcelain -- site/data/)" ]; then
            mkdir -p "$RUNNER_TEMP/verified-data"
            cp -R site/data/. "$RUNNER_TEMP/verified-data/"
            git fetch origin main
            git reset --hard origin/main
            cp -R "$RUNNER_TEMP/verified-data/." site/data/
            if [ -n "$(git status --porcelain -- site/data/)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add site/data/
              git commit -m "data: refresh verified official H10 FX and DGBAS CPI"
              git push origin HEAD:main
            fi
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy within same workflow
        uses: actions/deploy-pages@v4
      - name: Independently read back public Pages and data integrity
        run: python scripts/verify_live.py
